<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ed"><title>Field Route | 巡回プラン</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#282b2e;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:20px 16px 14px;border-bottom:1px solid #e3dfd8;position:sticky;top:0;z-index:2}header h1{font-size:20px;margin:0 0 5px}header p{color:#686b71;font-size:12px;margin:0}main{max-width:740px;margin:auto;padding:14px 12px 90px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.btn{background:#fff;border:1px solid #c9c6bd;border-radius:9px;padding:10px 12px;color:#344755;font-weight:600;font-size:13px;cursor:pointer;min-height:39px}.btn.primary{background:#196389;color:white;border-color:#196389}.btn:disabled{opacity:.35;cursor:default}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}.stat{border-radius:12px;background:#fff;border:1px solid #e5e2db;padding:11px 7px;text-align:center}.stat strong{font-size:23px;display:block;font-variant-numeric:tabular-nums}.stat small{font-size:11px;color:#6a6b6f}.item{display:flex;gap:10px;background:white;border:1px solid #e6ded2;box-shadow:0 2px 5px #00000008;border-radius:14px;padding:14px 12px;margin-bottom:12px}.num{background:#b64722;color:white;width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:grid;place-items:center;font-weight:700;margin-top:2px}.content{min-width:0;flex:1}.name{font-size:16px;font-weight:700;line-height:1.45}.meta{color:#72716f;font-size:12px;margin-top:4px;line-height:1.5}.short{color:#9b4128;font-weight:700}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:11px}.small{padding:7px 11px;font-size:14px;min-height:37px;border-radius:8px}.updown{min-width:38px}.fill{display:flex;align-items:center;justify-content:space-between;background:#f5f2ec;border-radius:10px;padding:10px;margin-top:12px;gap:6px}.fill span{font-size:13px;color:#68645e}.fill input{width:76px;max-width:30%;font-size:20px;text-align:center;padding:8px 4px;border:1px solid #ccc4b7;border-radius:8px;background:white}.count{font-weight:700}.controls{border:1px solid #ddd4c8;background:white;padding:14px;border-radius:12px;margin:14px 0}input,textarea{font:inherit}input[type=text],input[type=number],textarea{border:1px solid #ccc4b7;padding:10px;border-radius:7px;width:100%}label{display:block;font-size:12px;color:#585b60;margin:10px 0 4px}textarea{min-height:110px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.notice{font-size:12px;color:#666;line-height:1.6}.footer{font-size:12px;color:#888;text-align:center;padding:12px}.hidden{display:none}.pill{background:#eaf3f6;border-radius:6px;color:#20607b;padding:3px 7px}.done{opacity:.55}.done .num{background:#67816b}.modalback.hidden{display:none}.modalback{position:fixed;inset:0;background:#0008;z-index:5;display:flex;align-items:flex-end;justify-content:center}.modal{max-height:90vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;width:min(740px,100%);padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.modal h2{font-size:19px;margin:0 0 8px}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions>*{flex:1}.empty{text-align:center;padding:42px 12px;color:#777}@media(max-width:390px){.name{font-size:15px}.item{padding:11px 9px}.num{width:29px;height:29px;flex-basis:29px}.fill span{font-size:12px}}
</style></head><body><header><h1>☂️ Field Route</h1><p>巡回計画の個人用試作品｜補充本数と順序を手動で変更できます</p></header><main><div class="stats"><div class="stat"><strong id="sPlaces">0</strong><small>巡回先</small></div><div class="stat"><strong id="sNeed">0</strong><small>不足本数の合計</small></div><div class="stat"><strong id="sPlan">0</strong><small>持参・補充予定</small></div></div><div class="toolbar"><button class="btn primary" onclick="openAdd()">＋ スポット追加</button><button class="btn" onclick="toggleImport()">一覧を貼り付け</button><button class="btn" onclick="exportCSV()">CSV保存</button><button class="btn primary" onclick="backupData()">データを保存</button><button class="btn" onclick="document.getElementById('backupFile').click()">保存データを開く</button><input type="file" id="backupFile" accept=".json,application/json" style="display:none" onchange="restoreData(event)"><button class="btn" onclick="resetDemo()">サンプルに戻す</button></div><section class="controls hidden" id="importPanel"><b>スプレッドシートから一括取り込み</b><p class="notice">1行に「スポット名,現在本数,最適本数,補充予定本数,地図URL」の順で貼り付け。タブ区切りにも対応。ヘッダー行は省略可。読み込むと現在の一覧を置き換えます。</p><textarea id="importText" placeholder="サンプルスポットA,0,6,8,https://maps.google.com/\nサンプルスポットB,1,13,14"></textarea><div class="row"><button class="btn primary" onclick="importTextData()">取り込む</button><button class="btn" onclick="toggleImport()">閉じる</button></div></section><div id="list"></div><p class="footer">変更内容は、この端末のブラウザ内に自動保存されます。他の端末とは同期されません。端末のデータ消去に備え、定期的に「データを保存」でJSONバックアップを作成してください。実際の在庫とは連動していません。</p></main><div id="modal" class="modalback hidden"><div class="modal"><h2 id="modalTitle">スポット追加</h2><label for="fName">スポット名</label><input id="fName" type="text" placeholder="例：サンプルスポットC"><div class="grid"><div><label for="fCurrent">現在本数</label><input id="fCurrent" type="number" min="0" value="0"></div><div><label for="fOptimal">最適本数</label><input id="fOptimal" type="number" min="0" value="10"></div></div><label for="fPlan">補充予定本数</label><input id="fPlan" type="number" min="0" value="10"><label for="fMap">マップURL（任意）</label><input id="fMap" type="text" placeholder="https://maps.google.com/..."><label for="fNote">メモ・営業時間など（任意）</label><input id="fNote" type="text" placeholder="例：21時まで入館可"><div class="modal-actions"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="saveModal()">保存</button></div></div></div><script>
const KEY='field-route-local-v1';const demo=[{name:'サンプルスポットA',current:0,optimal:6,plan:8,note:'',map:'',done:false},{name:'サンプルスポットB',current:1,optimal:13,plan:14,note:'',map:'',done:false}];let items;try{items=JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch(e){items=JSON.parse(JSON.stringify(demo))}let editing=-1;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeurl(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}function int(v){return Math.max(0,Math.min(99999,parseInt(v,10)||0))}function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}function render(){let need=items.reduce((s,x)=>s+Math.max(0,x.optimal-x.current),0),plan=items.reduce((s,x)=>s+x.plan,0);document.getElementById('sPlaces').textContent=items.length;document.getElementById('sNeed').textContent=need;document.getElementById('sPlan').textContent=plan;document.getElementById('list').innerHTML=items.length?items.map((x,i)=>{let n=Math.max(0,x.optimal-x.current);return `<section class="item ${x.done?'done':''}"><div class="num">${i+1}</div><div class="content"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.note||'')}　現在 ${x.current} ／ 最適 ${x.optimal}　· <span class="short">${n}本 補充</span></div><div class="row"><button class="btn small" onclick="openMap(${i})">マップ ↗</button><button class="btn small updown" ${i===0?'disabled':''} onclick="shift(${i},-1)">↑</button><button class="btn small updown" ${i===items.length-1?'disabled':''} onclick="shift(${i},1)">↓</button><button class="btn small" onclick="moveTo(${i})">順番指定</button><button class="btn small" onclick="openEdit(${i})">編集</button><button class="btn small" onclick="toggleDone(${i})">${x.done?'✓ 完了':'完了'}</button><button class="btn small" onclick="removeItem(${i})">×</button></div><div class="fill"><span>補充する本数（必要 ${n}本）</span><div style="display:flex;align-items:center;gap:5px"><input aria-label="${esc(x.name)}の補充予定本数" type="number" min="0" value="${x.plan}" onchange="setPlan(${i},this.value)"><span>本</span></div></div></div></section>`}).join(''):'<div class="empty">スポットがありません。「＋ スポット追加」から登録してください。</div>';persist()}
function shift(i,d){let j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}function moveTo(i){let v=prompt(`「${items[i].name}」を何番目に移動しますか？（1〜${items.length}）`,String(i+1));if(v===null)return;let n=parseInt(v,10);if(!(n>=1&&n<=items.length)){alert('有効な番号を入力してください');return}items.splice(n-1,0,items.splice(i,1)[0]);render()}function setPlan(i,v){items[i].plan=int(v);render()}function toggleDone(i){items[i].done=!items[i].done;render()}function removeItem(i){if(confirm('このスポットを一覧から外しますか？')){items.splice(i,1);render()}}function openMap(i){let u=safeurl(items[i].map);if(u)window.open(u,'_blank','noopener');else window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(items[i].name),'_blank','noopener')}
function openAdd(){editing=-1;fillForm({name:'',current:0,optimal:10,plan:10,note:'',map:''});document.getElementById('modalTitle').textContent='スポット追加';document.getElementById('modal').classList.remove('hidden')}function openEdit(i){editing=i;fillForm(items[i]);document.getElementById('modalTitle').textContent='スポット編集';document.getElementById('modal').classList.remove('hidden')}function fillForm(x){for(let [key,id] of [['name','fName'],['current','fCurrent'],['optimal','fOptimal'],['plan','fPlan'],['map','fMap'],['note','fNote']])document.getElementById(id).value=x[key]??''}function closeModal(){document.getElementById('modal').classList.add('hidden')}function saveModal(){let x={name:document.getElementById('fName').value.trim(),current:int(document.getElementById('fCurrent').value),optimal:int(document.getElementById('fOptimal').value),plan:int(document.getElementById('fPlan').value),map:document.getElementById('fMap').value.trim(),note:document.getElementById('fNote').value.trim(),done:editing>=0?items[editing].done:false};if(!x.name){alert('スポット名を入力してください');return}if(editing>=0)items[editing]=x;else items.push(x);closeModal();render()}
function toggleImport(){document.getElementById('importPanel').classList.toggle('hidden')}function parseRow(l){let d=l.includes('\t')?'\t':',';if(d==='\t')return l.split('\t').map(v=>v.trim());let out=[],cur='',quoted=false;for(let k=0;k<l.length;k++){let c=l[k];if(c==='"'){if(quoted&&l[k+1]==='"'){cur+='"';k++}else quoted=!quoted}else if(c===','&&!quoted){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}function importTextData(){let lines=document.getElementById('importText').value.split(/\r?\n/).filter(x=>x.trim()),newItems=lines.map(parseRow).filter(a=>a[0]&&!/^(スポット名|name)$/i.test(a[0])).map(a=>({name:a[0],current:int(a[1]),optimal:int(a[2]),plan:a[3]===''||a[3]==null?Math.max(0,int(a[2])-int(a[1])):int(a[3]),map:a[4]||'',note:a[5]||'',done:false}));if(!newItems.length){alert('読み込めるスポットがありません');return}if(!confirm(`${newItems.length}件を読み込み、現在の一覧を置き換えますか？`))return;items=newItems;toggleImport();render()}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){let rows=[['スポット名','現在本数','最適本数','補充予定本数','地図URL','メモ','完了'],...items.map(x=>[x.name,x.current,x.optimal,x.plan,x.map,x.note,x.done?'済':'未'])];let blob=new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='field_route.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backupData(){const content=JSON.stringify({format:'ikasa-route-v2',exportedAt:new Date().toISOString(),items},null,2);const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='field_route_backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);alert('保存画面が開かない場合はSafariのダウンロード表示を確認してください。保存先は「ファイル」アプリです。');}
async function restoreData(event){const file=event.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||obj.format!=='ikasa-route-v2'||!Array.isArray(obj.items))throw Error('別形式のファイルです');const loaded=obj.items.map(x=>({name:String(x.name||'').trim(),current:int(x.current),optimal:int(x.optimal),plan:int(x.plan),map:String(x.map||''),note:String(x.note||''),done:Boolean(x.done)}));if(loaded.some(x=>!x.name))throw Error('スポット名がありません');if(!confirm(loaded.length+'件の保存データを読み込み、現在の内容を置き換えますか？'))return;items=loaded;render();alert('読み込みました');}catch(e){alert('読み込みできません：'+e.message)}finally{event.target.value=''}}
function resetDemo(){if(confirm('現在の一覧を消してサンプルに戻しますか？')){items=JSON.parse(JSON.stringify(demo));render()}}render();
</script></body></html>
